spring:
  application:
    name: aggregator
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server

aggregator:
  kafka:
    consumer:
      properties:
        bootstrap.servers: localhost:9092
        group.id: aggregator-group
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.yandex.practicum.kafka.telemetry.serialization.SensorEventDeserializer
        enable.auto.commit: false
        auto.offset.reset: earliest
      topic: telemetry.sensors.v1
    producer:
      properties:
        bootstrap.servers: localhost:9092
        client.id: telemetry.aggregator
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: ru.yandex.practicum.kafka.telemetry.serialization.AvroSerializer
        acks: all
        retries: 3
      topic: telemetry.snapshots.v1

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/