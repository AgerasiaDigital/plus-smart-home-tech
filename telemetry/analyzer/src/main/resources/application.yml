spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5432/analyzer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    snapshots-consumer:
      properties:
        bootstrap.servers: localhost:9092
        group.id: analyzer-snapshots-group
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.yandex.practicum.kafka.telemetry.serialization.SensorsSnapshotDeserializer
        enable.auto.commit: false
        auto.offset.reset: earliest
      topic: telemetry.snapshots.v1
    hubs-consumer:
      properties:
        bootstrap.servers: localhost:9092
        group.id: analyzer-hubs-group
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.yandex.practicum.kafka.telemetry.serialization.HubEventDeserializer
        enable.auto.commit: false
        auto.offset.reset: earliest
      topic: telemetry.hubs.v1