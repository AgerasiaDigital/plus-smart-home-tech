spring:
  application:
    name: analyzer

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    snapshot-consumer:
      topic: telemetry.snapshots.v1
      properties:
        "bootstrap.servers": localhost:9092
        "group.id": "analyzer-snapshot-group"
        "key.deserializer": org.apache.kafka.common.serialization.StringDeserializer
        "value.deserializer": ru.yandex.practicum.telemetry.analyzer.deserializer.SnapshotDeserializer
        "auto.offset.reset": latest
        "enable.auto.commit": false
        "max.poll.records": 50
        "max.poll.interval.ms": 300000

    hub-event-consumer:
      topic: telemetry.hubs.v1
      properties:
        "bootstrap.servers": localhost:9092
        "group.id": "analyzer-hub-event-group"
        "key.deserializer": org.apache.kafka.common.serialization.StringDeserializer
        "value.deserializer": ru.yandex.practicum.telemetry.analyzer.deserializer.HubEventDeserializer
        "auto.offset.reset": earliest
        "enable.auto.commit": false