spring:
  cloud:
    gateway:
      routes:
        - id: order-route
          uri: lb://order
          predicates:
            - Path=/api/v1/order/**
          filters:
            - StripPrefix=0

        - id: payment-route
          uri: lb://payment
          predicates:
            - Path=/api/v1/payment/**
          filters:
            - StripPrefix=0

        - id: delivery-route
          uri: lb://delivery
          predicates:
            - Path=/api/v1/delivery/**
          filters:
            - StripPrefix=0

        - id: shopping-store-route
          uri: lb://shopping-store
          predicates:
            - Path=/api/v1/shopping-store/**
          filters:
            - StripPrefix=0

        - id: shopping-cart-route
          uri: lb://shopping-cart
          predicates:
            - Path=/api/v1/shopping-cart/**
          filters:
            - StripPrefix=0

        - id: warehouse-route
          uri: lb://warehouse
          predicates:
            - Path=/api/v1/warehouse/**
          filters:
            - StripPrefix=0

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/